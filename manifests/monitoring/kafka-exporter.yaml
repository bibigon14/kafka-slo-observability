# kafka_exporter (danielqsj/kafka-exporter) exposes consumer-group lag
# per partition. The upstream Kafka JMX exporter on the brokers covers
# broker-side metrics but NOT consumer-group lag, because consumer offsets
# are only tracked by the group coordinator and are not exposed as a
# Kafka MBean. kafka_exporter sits outside the broker, talks to the
# cluster as a client, and does a kafka-consumer-groups-equivalent query
# every scrape.
#
# The SLO burn-rate recording rule (manifests/monitoring/kafka-slo-recording.yaml)
# depends on kafka_consumergroup_lag from this exporter, which in turn
# drives KafkaConsumerLagBurnRateFast / Slow alerts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server=demo-kafka-bootstrap:9092
            - --group.filter=demo-consumer-group
            - --topic.filter=demo-events
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 200m
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: kafka
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      app: kafka-exporter
  namespaceSelector:
    matchNames:
      - kafka
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
