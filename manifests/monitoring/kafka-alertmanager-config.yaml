# AlertmanagerConfig - routes all Kafka SLO alerts (by alertname prefix)
# to a Telegram bridge running on the homelab Raspberry Pi, over a
# WireGuard tunnel to this OCI VM.
#
# The bridge (alertmanager-telegram-bridge) runs as a k8s Deployment on
# the Pi, exposed via NodePort 30119 at 10.0.0.1 (homelab WireGuard IP
# as seen from this OCI VM, 10.0.0.4). The Telegram bot token lives in
# a k8s Secret on the Pi - this cluster holds no credentials.
#
# kube-prometheus-stack's Alertmanager was installed with
# alertmanagerConfigSelector: {} and alertmanagerConfigNamespaceSelector: {},
# so this CR is picked up without extra selectors.
#
# Matcher note: we match on alertname regex rather than namespace, because
# upstream Kafka burn-rate alerts don't carry a namespace label by default -
# the recording rule they consume aggregates away pod-level labels, so no
# namespace reaches the alert payload. Alertname regex is a stable contract
# and future Kafka SLO alerts just need to keep the Kafka prefix.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kafka-slo-alerts
  namespace: kafka
  labels:
    app: strimzi
spec:
  route:
    receiver: kafka-telegram-bridge
    # Group by cluster+alertname so three brokers down become one message,
    # not three.
    groupBy: [alertname, consumergroup]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
    matchers:
      - matchType: =~
        name: alertname
        value: "Kafka.*"
    # critical/page alerts repeat sooner so pages don't go silent while
    # the burn-rate alert is still firing.
    routes:
      - receiver: kafka-telegram-bridge
        matchers:
          - name: severity
            value: critical
        repeatInterval: 15m
  receivers:
    - name: kafka-telegram-bridge
      webhookConfigs:
        - url: http://10.0.0.1:30119/webhook
          sendResolved: true
